# ============================================================
# Secrets and account ID scanning
# ============================================================
# Runs gitleaks on every PR to catch secrets or account IDs
# that slipped through local pre-commit hooks.
#
# Same tool and config as the local pre-commit hook, so what
# passes locally will pass here.
#
# Uses the gitleaks CLI directly (not the GitHub Action) because
# gitleaks-action requires a paid license when used in a GitHub
# Organization.
# ============================================================

name: Secrets scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so gitleaks can scan all commits in the PR
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact