# ============================================================
# Secrets and account ID scanning
# ============================================================
# Runs gitleaks on every PR to catch secrets or account IDs
# that slipped through local pre-commit hooks.
#
# Same tool and config as the local pre-commit hook, so what
# passes locally will pass here.
# ============================================================

name: Secrets scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so gitleaks can scan all commits in the PR
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml