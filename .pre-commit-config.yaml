# ============================================================
# Pre-commit hooks for gds-aidr-infrastructure
# ============================================================
# Runs local checks before every commit to catch issues early.
# Install once locally with: pre-commit install
#
# See CONTRIBUTING.md for full setup instructions.
# ============================================================

repos:
  # ----------------------------------------------------------
  # gitleaks - secrets and account ID scanning
  # ----------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (secrets and account ID scan)

  # ----------------------------------------------------------
  # basic hygiene
  # ----------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # ----------------------------------------------------------
  # terraform formatting
  # ----------------------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
        name: terraform fmt